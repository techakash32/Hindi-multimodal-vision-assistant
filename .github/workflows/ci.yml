name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-ci.txt && pip install -e . --no-deps
      - run: ruff check .
      - run: pytest --cov=visionassist --cov-report=term-missing   # add --cov-fail-under=<your measured %> once you have run it locally